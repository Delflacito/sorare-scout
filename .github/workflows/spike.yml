name: Spike API
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p spike-output && node scripts/check-sorare-key.mjs | tee spike-output/key-check.txt
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
      - run: node scripts/spike-sorare-lineups.mjs
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
      # Réponses brutes publiées sur la branche spike-results (lisible sans téléchargement d'artefact).
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan spike-results
          git rm -rq --cached .
          git add -f spike-output
          git commit -qm "Résultats du spike $(date -u +%FT%TZ)"
          git push -f origin spike-results
