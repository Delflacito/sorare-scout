name: Import quotidien
concurrency: ingest
on:
  schedule:
    # GitHub démarre les tâches planifiées avec 7 à 8 h de retard (mesuré en novembre 2026) : demandé la veille au soir
    # pour des données prêtes le matin.
    - cron: '17 21 * * *'
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
