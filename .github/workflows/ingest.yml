name: Import quotidien
concurrency: ingest
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
