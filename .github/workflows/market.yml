name: Marché des cartes
# Rafraîchissement complet des prix, lancé à la main seulement : l'import quotidien met déjà à jour une partie du marché,
# et le passage automatique de l'après-midi (~50 min) faisait dépasser le quota gratuit de GitHub Actions.
concurrency: market
on:
  workflow_dispatch:
    inputs:
      ventes:
        description: Ventes demandées par joueur (50 par défaut ; davantage pour rattraper l'historique)
        default: '50'
jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run market
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MARKET_SALES: ${{ inputs.ventes }}
