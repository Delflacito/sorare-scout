name: Marché des cartes
# Second rafraîchissement des prix dans la journée (le premier a lieu pendant l'import quotidien).
concurrency: market
on:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run market
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
